<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back to Skool</title>
  <meta name="description" content="A faithful, moddable browser remake of the 1985 ZX Spectrum game Back to Skool.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400&display=swap" rel="stylesheet">
  <style>
/* ============================================================================
   BACK TO SKOOL — page styling
   ----------------------------------------------------------------------------
   The game itself is drawn on the canvas; everything here is the frame around
   it: the HUD strip, the sidebar panels and the menus. Light-first, Ubuntu at
   weights 300/400 only.
   ============================================================================ */

/* Layout: a HUD strip across the top, the game canvas left, a column of
   feature panels right; everything stacks on a phone. Colours are tokens so
   the page follows the viewer's light/dark preference. */
:root {
  --bg: #eceff3;            /* slate-tinted paper */
  --surface: #ffffff;
  --ink: #1d2430;
  --muted: #5f6b7a;
  --line: #d9dfe7;
  --accent: #a4252c;        /* school-tie red */
  --accent-ink: #ffffff;
  --ok: #2e7d32;
  --warn: #b26a00;
  --overlay: rgba(20, 26, 34, 0.55);
  --radius: 10px;
  --font: 'Ubuntu', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a21; --surface: #1f2630; --ink: #e8ecf1; --muted: #9aa6b4; --line: #2d3641;
    --accent: #e0565c; --accent-ink: #ffffff; --ok: #66bb6a; --warn: #ffb74d; --overlay: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a21; --surface: #1f2630; --ink: #e8ecf1; --muted: #9aa6b4; --line: #2d3641;
  --accent: #e0565c; --accent-ink: #ffffff; --ok: #66bb6a; --warn: #ffb74d; --overlay: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 300; }
h1, h2, h3, strong, b { font-weight: 400; }
a { color: inherit; }

#app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  grid-template-areas: "hud hud" "stage side" "foot foot";
  gap: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1600px;
  margin: 0 auto;
}
#hud { grid-area: hud; }
#stage { grid-area: stage; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.screen { position: relative; max-width: 100%; }

/* ---- Key strip (always visible) ------------------------------------------ */
.keys-strip {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px;
  font-size: 13px; color: var(--muted); max-width: 100%;
}
.keys-strip .k { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.keys-strip kbd {
  font: inherit; font-size: 12px; padding: 1px 6px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 20px; text-align: center;
}
.keys-strip .ui { opacity: 0.8; }
.keys-strip button.view-toggle { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0; }
.keys-strip button.view-toggle:hover kbd { border-color: var(--ink); }

/* ---- Original (1985) view ------------------------------------------------- */
html.view-original #app { grid-template-columns: 1fr; grid-template-areas: "stage" "foot"; }
html.view-original #hud .hud-top, html.view-original #sidebar { display: none; }
html.view-original #game { border-radius: 0; box-shadow: none; border: 24px solid #000; }
html.view-original .overlay { border-radius: 0; }
html.view-original { background: #202327; --bg: #202327; --ink: #e8ecf1; --muted: #a9b2bd; --surface: #2b3037; --line: #3a414a; }
#sidebar { grid-area: side; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.foot { grid-area: foot; color: var(--muted); font-size: 13px; }

@media (max-width: 1000px) {
  #app { grid-template-columns: 1fr; grid-template-areas: "hud" "stage" "side" "foot"; }
}

/* ---- Canvas ---------------------------------------------------------------- */
#game {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
  border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  max-width: 100%;
}

/* ---- HUD strip -------------------------------------------------------------- */
.hud-top {
  display: grid;
  grid-template-columns: 220px 1fr auto auto;
  gap: 16px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
}
.lesson-box { position: relative; padding: 4px 8px 10px; border-left: 3px solid var(--accent); }
.lesson-teacher { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lesson-room { font-size: 18px; letter-spacing: 0.04em; }
.lesson-bar { position: absolute; left: 8px; right: 8px; bottom: 2px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.lesson-bar-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.3s linear; }
.stats { display: flex; gap: 28px; justify-content: center; }
.stat { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
.stat-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat-value { font-size: 24px; font-variant-numeric: tabular-nums; }
.stat-lines.danger .stat-value { color: var(--accent); }
.inventory { display: flex; gap: 6px; font-size: 20px; min-width: 120px; justify-content: flex-end; }
.inventory .empty { font-size: 12px; color: var(--muted); align-self: center; }
.menu-button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.menu-button:hover { border-color: var(--ink); }

@media (max-width: 800px) {
  .hud-top { grid-template-columns: 1fr 1fr; }
  .stats { justify-content: flex-start; gap: 16px; }
}

/* ---- Sidebar panels --------------------------------------------------------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.panel h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.event-log { list-style: none; margin: 0; padding: 0; font-size: 13px; line-height: 1.4; }
.event-log li { padding: 4px 0; border-top: 1px solid var(--line); color: var(--muted); }
.event-log li:first-child { border-top: 0; color: var(--ink); }
.event-log li.highlight { color: var(--accent); }
.minimap { width: 100%; height: auto; image-rendering: pixelated; border-radius: 4px; }
.quest ol { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
.quest li.done { color: var(--muted); text-decoration: line-through; }
.quest .combos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-size: 12px; }
.quest .combos div { display: flex; flex-direction: column; background: var(--bg); border-radius: 6px; padding: 6px 8px; }
.quest .combos strong { font-size: 18px; letter-spacing: 0.2em; font-weight: 400; }
.quest .combos small { color: var(--muted); }
.radar { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.radar li { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line); }
.radar li:first-child { border-top: 0; }
.radar .name { min-width: 90px; }
.radar .where { color: var(--muted); font-size: 12px; }
.radar .tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.radar .tag.warn { background: var(--accent); color: var(--accent-ink); }
.radar li.watching .name { color: var(--accent); }

/* ---- Overlay menus ---------------------------------------------------------- */
.overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--overlay);
  border-radius: var(--radius);
  padding: 16px;
  backdrop-filter: blur(2px);
}
.overlay[hidden] { display: none; }
.menu-card {
  background: var(--surface);
  color: var(--ink);
  border-radius: 14px;
  padding: 28px 32px;
  max-width: 640px;
  width: 100%;
  max-height: 100%;
  overflow: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}
.menu-card h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: -0.01em; }
.menu-card h2 { margin: 18px 0 6px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.menu-card .eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.menu-card .lede { font-size: 17px; line-height: 1.5; margin: 0 0 16px; }
.menu-card .small { font-size: 12px; color: var(--muted); line-height: 1.5; }
.menu-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.menu-actions button {
  font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.menu-actions button:hover { border-color: var(--ink); }
.menu-actions button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.options { display: flex; flex-direction: column; gap: 12px; }
.opt { display: grid; grid-template-columns: 1fr; gap: 4px; font-size: 15px; }
.opt small { color: var(--muted); font-size: 12px; }
.opt input[type="checkbox"] { width: 18px; height: 18px; margin: 0 8px 0 0; vertical-align: -3px; }
.opt select, .opt input[type="range"] { font: inherit; }
.opt output { color: var(--muted); font-size: 13px; margin-left: 8px; }
.keys { width: 100%; border-collapse: collapse; font-size: 14px; }
.keys td { padding: 6px 8px; border-top: 1px solid var(--line); }
.keys td:first-child { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; width: 140px; }
.rules { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
.rules.notes { font-style: italic; }

/* ---- Tape loader (original view, when no original graphics are loaded) --- */
.tape-loader {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  max-width: 900px; margin-top: 4px; padding: 10px 14px; font-size: 13px; line-height: 1.45;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted);
}
.tape-loader[hidden] { display: none; }
.tape-loader .tape-text { flex: 1 1 420px; min-width: 0; }
.tape-loader strong { color: var(--ink); }
.tape-loader code { font-size: 12px; }
.tape-button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer; white-space: nowrap; }
.tape-status { font-size: 13px; color: var(--ink); }

</style>
</head>
<body>
  <div id="app">
    <div id="hud"></div>
    <main id="stage">
      <div class="screen">
        <canvas id="game" width="384" height="168" aria-label="Back to Skool game view"></canvas>
        <div id="overlay" class="overlay" hidden></div>
      </div>
      <div id="keys" class="keys-strip" aria-label="Controls"></div>
      <div id="tape"></div>
    </main>
    <aside id="sidebar"></aside>
    <footer class="foot"><span>Back to Skool remake · single-file build</span></footer>
  </div>
  <script>
(() => {
  // src/data/skool.js
  var SKOOL = {
    width: 192,
    // cells
    height: 21,
    // cells
    cell: 8,
    // pixels per cell
    // The playground: x range where Eric counts as being "outside".
    playground: [96, 158],
    // Walls block movement AND sight. (id, x, bottomY, topY)
    // A wall at column x stops a character whose top row y satisfies
    // topY - 4 < y <= bottomY from crossing from x-1 to x.
    walls: [
      { id: "FarLeftWall", x: 0, bottomY: 20, topY: 0 },
      { id: "FarRightWall", x: 191, bottomY: 20, topY: 0 },
      { id: "ScienceLabWall", x: 64, bottomY: 13, topY: 7 },
      { id: "TopRightWall", x: 93, bottomY: 6, topY: 5 },
      { id: "MiddleRightWall", x: 95, bottomY: 13, topY: 12 },
      { id: "TopLeftWall", x: 160, bottomY: 6, topY: 0 },
      { id: "MiddleLeftWall", x: 160, bottomY: 13, topY: 7 }
    ],
    // Rooms: a rectangle of cells. "getAlong" means a teacher will tell Eric to
    // get along if he's found here when the timetable says he should be elsewhere.
    rooms: [
      { id: "BlueRoom", name: "BLUE ROOM", topLeft: [0, 0], bottomRight: [23, 6], getAlong: true },
      { id: "YellowRoom", name: "YELLOW ROOM", topLeft: [40, 0], bottomRight: [63, 6], getAlong: true },
      { id: "ScienceLab", name: "SCIENCE LAB", topLeft: [30, 7], bottomRight: [54, 13], getAlong: true },
      { id: "MiddleRoom", name: "MIDDLE ROOM", topLeft: [159, 7], bottomRight: [179, 13], getAlong: true },
      { id: "UpperRoom", name: "UPPER ROOM", topLeft: [159, 0], bottomRight: [180, 6], getAlong: true },
      { id: "DinnerHall", name: "DINNER", topLeft: [42, 14], bottomRight: [62, 20], getAlong: false },
      { id: "AssemblyHall", name: "ASSEMBLY", topLeft: [63, 14], bottomRight: [76, 20], getAlong: false }
    ],
    // Blackboards: 8 cells wide, 2 tall. Characters write on them.
    blackboards: [
      { room: "BlueRoom", topLeft: [3, 3], size: [8, 2] },
      { room: "YellowRoom", topLeft: [41, 3], size: [8, 2] },
      { room: "ScienceLab", topLeft: [32, 9], size: [8, 2] },
      { room: "UpperRoom", topLeft: [161, 3], size: [8, 2] },
      { room: "MiddleRoom", topLeft: [161, 9], size: [8, 2] }
    ],
    // Chairs (and desks, which sit at the same x) per room. The first chair in
    // each list is the FRONT seat (nearest the blackboard).
    chairs: {
      BlueRoom: [11, 13, 15, 17, 19, 21],
      YellowRoom: [50, 52, 54, 56, 58, 60],
      ScienceLab: [40, 42, 44, 46, 48, 50, 52],
      MiddleRoom: [167, 169, 171, 173, 175, 177],
      UpperRoom: [168, 170, 172, 174, 176, 178]
    },
    desks: {
      BlueRoom: [11, 13, 15, 17, 19, 21],
      YellowRoom: [50, 52, 54, 56, 58, 60],
      ScienceLab: [40, 42, 44, 46, 48, 50, 52],
      MiddleRoom: [167, 169, 171, 173, 175, 177],
      UpperRoom: [168, 170, 172, 174, 176, 178]
    },
    // Doors. autoShutDelay > 0 means the door closes itself that many ticks after
    // being opened. "coords" is where the door is drawn. climb/fly name animation
    // sequences Eric uses to get over the gate.
    doors: [
      { id: "StudyBackDoor", x: 73, bottomY: 6, topY: 0, shut: true, autoShutDelay: 40, coords: [71, 2], size: [3, 5] },
      { id: "StudyDoor", x: 84, bottomY: 6, topY: 0, shut: true, autoShutDelay: 40, coords: [84, 2], size: [3, 5] },
      { id: "ScienceLabDoor", x: 54, bottomY: 13, topY: 7, shut: true, autoShutDelay: 40, coords: [54, 9], size: [3, 5] },
      { id: "SkoolDoor", x: 95, bottomY: 20, topY: 14, shut: false, autoShutDelay: 0, coords: [93, 16], size: [3, 5] },
      { id: "SkoolGate", x: 134, bottomY: 20, topY: 14, shut: false, autoShutDelay: 0, coords: [132, 17], size: [4, 4], climb: "ClimbSkoolGate", fly: "FlyOverSkoolGate" },
      // The drinks cabinet is modelled as a "door" that never blocks anyone.
      { id: "DrinksCabinet", x: 0, bottomY: 0, topY: 0, shut: true, autoShutDelay: 0, coords: [190, 2], size: [2, 2] }
    ],
    // Windows Eric can climb out of once opened. "openerCoords" is where a
    // teacher stands to open it. "notABird" means jumping out expels Eric.
    windows: [
      { id: "UpperWindow", x: 93, bottomY: 4, topY: 2, shut: true, openerCoords: [90, 3], coords: [92, 2], size: [3, 3], descent: "DescentUpperWindow", notABird: "ExpelEric:NotABird" },
      { id: "MiddleWindow", x: 95, bottomY: 11, topY: 8, shut: true, openerCoords: [92, 10], coords: [94, 8], size: [2, 4], descent: "DescentMiddleWindow" }
    ],
    // Floors: horizontal strips a character can stand on.
    floors: [
      { id: "Bottom", minX: 0, maxX: 191, y: 17 },
      { id: "Stage", minX: 77, maxX: 81, y: 14 },
      { id: "LeftMiddle", minX: 0, maxX: 64, y: 10 },
      { id: "RightMiddle", minX: 85, maxX: 94, y: 10 },
      { id: "GirlsMiddle", minX: 159, maxX: 191, y: 10 },
      { id: "LeftTop", minX: 0, maxX: 73, y: 3 },
      { id: "RightTop", minX: 74, maxX: 94, y: 3 },
      { id: "GirlsTop", minX: 159, maxX: 191, y: 3 }
    ],
    // Staircases: a diagonal from "bottom" to "top", one cell across per cell up.
    // "force" means you can't walk past the end without going up/down it.
    staircases: [
      { id: "UpToToilets", alias: "DownFromToilets", bottom: [22, 17], top: [15, 10] },
      { id: "UpToStage", alias: "DownFromStage", bottom: [83, 17], top: [80, 14] },
      { id: "GirlsSkoolLower", bottom: [176, 17], top: [183, 10] },
      { id: "UpFromStage", alias: "DownToStage", bottom: [81, 14], top: [85, 10], force: true },
      { id: "UpToLibrary", alias: "DownFromLibrary", bottom: [19, 10], top: [26, 3] },
      { id: "UpToStudy", alias: "DownFromStudy", bottom: [91, 10], top: [84, 3] },
      { id: "GirlsSkoolUpper", bottom: [186, 10], top: [179, 3] }
    ],
    // Routes: from a floor, which staircase takes you towards a destination
    // floor. '*' is the default for any floor not listed.
    routes: {
      Bottom: { LeftMiddle: "UpToToilets", LeftTop: "UpToToilets", GirlsMiddle: "GirlsSkoolLower", GirlsTop: "GirlsSkoolLower", "*": "UpToStage" },
      Stage: { RightMiddle: "UpFromStage", RightTop: "UpFromStage", "*": "UpToStage" },
      LeftMiddle: { LeftTop: "UpToLibrary", "*": "UpToToilets" },
      RightMiddle: { RightTop: "UpToStudy", "*": "UpFromStage" },
      GirlsMiddle: { GirlsTop: "GirlsSkoolUpper", "*": "GirlsSkoolLower" },
      LeftTop: { "*": "UpToLibrary" },
      RightTop: { "*": "UpToStudy" },
      GirlsTop: { "*": "GirlsSkoolUpper" }
    },
    // Places Eric must never be (a teacher who sees him there gives lines).
    noGoZones: [
      { id: "GirlsSkool", minX: 159, maxX: 195, bottomY: 17, topY: 0 },
      { id: "AroundStage", minX: 77, maxX: 94, bottomY: 16, topY: 4 },
      { id: "HeadsArea", minX: 63, maxX: 93, bottomY: 3, topY: 0 },
      { id: "ScienceLabStoreroom", minX: 54, maxX: 63, bottomY: 10, topY: 4 }
    ],
    // The safe in the head's study (Eric jumps up to it with the key).
    safe: { x: 81, y: 2 },
    // Cups on the walls. Eric fills them with the water pistol; a catapult pellet
    // knocks the contents onto whoever is underneath.
    cups: [
      { id: "LeftCup", x: 25, y: 14 },
      { id: "MiddleCup", x: 27, y: 14 },
      { id: "RightCup", x: 30, y: 14 },
      { id: "GirlsCup", x: 186, y: 14 }
    ],
    // Plant pots. Water makes the plant grow; Eric can stand on a grown plant.
    plants: [
      { id: "TopFloorPlant", x: 91, y: 3 },
      { id: "MiddleFloorPlant", x: 93, y: 10 },
      { id: "LeftGatePlant", x: 132, y: 17 },
      { id: "RightGatePlant", x: 135, y: 17 }
    ],
    // The conker in the tree: a pellet landing in this box knocks it down.
    conker: { minX: 98, maxX: 102, minY: 2, maxY: 3 },
    // Where the bike appears once unchained, and its physics.
    bike: { x: 100, y: 17, moveDelay: 3, pedalMomentum: 2, maxMomentum: 50 },
    // The frog starts in the science lab storeroom.
    frog: { x: 59, y: 10, ericProximity: 4 },
    // Where the mouse may turn up.
    mouseLocations: [[10, 3], [88, 3], [170, 3], [10, 10], [88, 10], [170, 10], [10, 17], [88, 17], [170, 17]],
    // Named locations the AI command lists refer to.
    locations: {
      "AssemblyHall:0": [71, 17],
      "AssemblyHall:1": [73, 17],
      "AssemblyHall:2": [75, 17],
      "AssemblyHall:Back": [65, 17],
      "AssemblyHall:WayBack": [62, 17],
      "AssemblyHallStage:Edge": [77, 14],
      "AssemblyHallStage:Middle": [79, 14],
      "BlueRoom:0": [21, 3],
      "BlueRoom:1": [22, 3],
      "BlueRoomBlackboard:Edge": [11, 3],
      "BlueRoomBlackboard:Middle": [6, 3],
      "BlueRoomDoorway": [23, 3],
      "BoysDinnerHall:0": [53, 17],
      "BoysDinnerHall:1": [54, 17],
      "BoysDinnerHall:End1": [40, 17],
      "BoysDinnerHall:End2": [61, 17],
      "BoysPlayground:Middle": [112, 17],
      "BoysSkoolDoor": [95, 17],
      "CloakRoom": [3, 17],
      "DrinksCabinet": [188, 3],
      "GirlsDinnerHall": [174, 17],
      "GirlsMiddleFloorWindow": [188, 10],
      "HeadsStudy:0": [81, 3],
      "HeadsStudy:Window": [76, 3],
      "JustOutsideToilets": [18, 10],
      "JustRightOfTree": [104, 17],
      "Kitchen": [189, 17],
      "MiddleRoom": [174, 10],
      "MiddleRoomBlackboard:Edge": [169, 10],
      "MiddleRoomBlackboard:Middle": [164, 10],
      "MiddleRoomDoorway": [179, 10],
      "RevisionLibrary": [31, 3],
      "RevisionLibrary:0": [36, 3],
      "RevisionLibrary:1": [37, 3],
      "ScienceLab:0": [48, 10],
      "ScienceLab:1": [50, 10],
      "ScienceLab:2": [51, 10],
      "ScienceLabBlackboard:Edge": [40, 10],
      "ScienceLabBlackboard:Middle": [35, 10],
      "ScienceLabDoorway": [28, 10],
      "SkoolGate:ToOpen": [132, 17],
      "SkoolGate:ToShut": [130, 17],
      "TakesStudyDoorway": [183, 3],
      "TopOfStairsDownToStage": [85, 10],

  var Cast = class {
    constructor(services, input) {
      this.services = services;
      const { world, game, config, rng } = services;
      this.world = world;
      this.game = game;
      this.config = config;
      this.rng = rng;
      services.cast = this;
      this.characters = CHARACTERS.map((spec) => new Character({ ...spec, randomLocations: RANDOM_LOCATIONS[spec.id] }, services));
      this.eric = new Eric({ ...ERIC, randomLocations: [] }, services, input);
      this.byId = new Map(this.characters.map((c) => [c.id, c]));
      this.byId.set(this.eric.id, this.eric);
      this.characterList = [...this.characters, this.eric];
      for (const [id, spec] of Object.entries(MESSAGES.qa)) {
        const teacher = this.byId.get(id);
        if (teacher) teacher.qaGenerator = new QAGenerator(spec, rng);
      }
      this.assemblyMessages = new AssemblyMessageGenerator(rng);
      const phases = world.animationPhases;
      this.pellets = [];
      for (const owner of [this.get("TEARAWAY"), this.eric]) {
        const pellet = new Pellet(`${owner.id}:Pellet`, services, owner);
        owner.pellet = pellet;
        this.pellets.push(pellet);
      }
      this.water = new Water("Water", services, phases.Water);
      this.waterDrop = new Drop("WaterDrop", services, "WATER");
      this.sherryDrop = new Drop("SherryDrop", services, "SHERRY");
      this.conker = new Conker("Conker", services, world.data.conker);
      this.stinkbomb = new Stinkbomb("Stinkbomb", services, 3);
      this.deskLid = new DeskLid("DeskLid", services);
      this.bike = new Bike("Bike", services, world.data.bike);
      this.frog = new Frog("Frog", services, world.data.frog, phases);
      this.frogs = [this.frog];
      this.mouse = new Mouse("Mouse", services, [17, 3], true);
      this.mice = [this.mouse];
      this.plants = world.plantPots.map((pot) => new Plant(`Plant:${pot.id}`, services, pot));
      this.mouseLocations = world.data.mouseLocations;
      this.lesson = null;
      this.ericStopper = null;
    }
    // Everything that needs a tick each frame, in update order.
    get movables() {
      return [
        this.eric,
        ...this.characters,
        ...this.pellets,
        this.water,
        this.waterDrop,
        this.sherryDrop,
        this.conker,
        this.stinkbomb,
        this.deskLid,
        this.bike,
        ...this.frogs,
        ...this.mice,
        ...this.plants
      ];
    }
    // Things the renderer draws (characters first so objects appear on top).
    get drawables() {
      return [
        ...this.characters,
        this.eric,
        ...this.plants,
        this.bike,
        ...this.frogs,
        ...this.mice,
        ...this.pellets,
        this.water,
